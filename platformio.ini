; https://docs.platformio.org/page/projectconf.html

[env:Chihiro]
platform = espressif32
board = pico32
framework = arduino
build_flags =
    -D CHIHIRO
lib_deps =
    https://github.com/rodneybakiskan/ps5-esp32.git
